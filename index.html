<!DOCTYPE html>
<html>
<head>
    <title>My Biodata</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .header {
            text-align: center;
            padding: 20px;
            background: white;
        }

        h1 {
            margin: 0;
        }

        .resume {
            width: 100%;
            height: 90vh;
            border: none;
        }

        .download {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background: black;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>My Biodata</h1>

        <a class="download"
           href="biodata.pdf"
           target="_blank">
           View / Download Biodata
        </a>
    </div>

    <iframe
        class="resume"
        src="biodata.pdf">
    </iframe>

</body>
</html>
